<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RettNav</title>
  </head>
  <body>
    <header>
      <button id="locate" type="button">Mein Standort</button>
      <form id="adressform" autocomplete="off">
        <input id="plz" inputmode="numeric" maxlength="5" placeholder="PLZ" />
        <input id="stadt" placeholder="Stadt" />
        <div class="suche">
          <input id="strasse" placeholder="Straße" />
          <ul id="vorschlaege" hidden></ul>
        </div>
        <input id="hausnummer" placeholder="Nr." />
        <button type="submit">Suchen</button>
      </form>
      <select id="klinikwahl">
        <option value="">Vorgegebene Klinik wählen …</option>
      </select>
      <div id="filter"></div>
      <p id="hinweis"></p>
    </header>
    <div id="map"></div>
    <p id="keintreffer" hidden>Keine Klinik hat alle gewählten Fachrichtungen.</p>
    <ol id="list"></ol>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
