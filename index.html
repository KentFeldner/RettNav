<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RettNav</title>
  </head>
  <body>
    <header>
      <button id="sperre" type="button" aria-pressed="false">🔓 Sperren</button>
      <button id="study" type="button" aria-pressed="false">🎓 Study</button>
      <button id="locate" type="button">Mein Standort</button>
      <button id="adressknopf" type="button" aria-expanded="false" aria-controls="adressform">📍 Adresse Einsatzort</button>
      <form id="adressform" autocomplete="off" hidden>
        <input id="plz" inputmode="numeric" maxlength="5" placeholder="PLZ" />
        <input id="stadt" placeholder="Stadt" />
        <div class="suche">
          <input id="strasse" placeholder="Straße" />
          <ul id="vorschlaege" hidden></ul>
        </div>
        <input id="hausnummer" placeholder="Nr." />
        <button type="submit">Suchen</button>
      </form>
      <select id="klinikwahl">
        <option value="">selber Klinik auswählen</option>
      </select>
      <div id="filter"></div>
      <p id="hinweis"></p>
    </header>
    <div id="auswahlinfo"></div>
    <main>
      <div id="map"></div>
      <aside id="seite">
        <p id="keintreffer" hidden>Keine Klinik hat alle gewählten Fachrichtungen.</p>
        <ol id="list"></ol>
        <div id="weg">
          <div id="wegkopf">
            <button id="wegzurueck" type="button">← Liste</button>
            <strong id="wegtitel"></strong>
          </div>
          <ol id="wegliste"></ol>
        </div>
      </aside>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
